<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClawKeep</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">🐾</span>
      <span class="brand-text">ClawKeep</span>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-tab="overview"><span class="nav-icon">◉</span> Overview</button>
      <button class="nav-item" data-tab="commits"><span class="nav-icon">⊙</span> Commits</button>
      <button class="nav-item" data-tab="files"><span class="nav-icon">≡</span> Code</button>
      <button class="nav-item" data-tab="diff"><span class="nav-icon">±</span> Changes</button>
    </nav>
    <div class="sidebar-footer">
      <div id="sidebar-info" class="sidebar-info"></div>
      <a class="sidebar-link" href="https://clawkeep.com" target="_blank">clawkeep.com</a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><h1 id="page-title">Overview</h1></div>
      <div class="topbar-right">
        <span id="last-updated" class="topbar-meta"></span>
        <button class="btn btn-ghost" onclick="refresh()">↻ Refresh</button>
        <button class="btn btn-primary" onclick="takeSnap()">✚ Snapshot</button>
      </div>
    </header>

    <div class="content">
      <section id="tab-overview">
        <div id="stats-grid" class="stats-grid"></div>
        <div id="pending-banner"></div>
        <div class="box"><div class="box-header">Recent activity <span id="recent-count" class="count"></span></div><div id="recent-body" class="box-body"></div></div>
      </section>

      <section id="tab-commits" class="hidden">
        <div id="commits-list">
          <div id="compare-bar" class="compare-bar hidden"></div>
          <div class="box"><div class="box-header"><span>Commits <span id="commits-count" class="count"></span></span><button id="compare-toggle" class="btn btn-ghost btn-sm" onclick="toggleCompareMode()">Compare</button></div><div id="commits-body" class="box-body"></div></div>
        </div>
        <div id="compare-result" class="hidden"></div>
      </section>

      <section id="tab-files" class="hidden">
        <div class="box">
          <div class="box-header"><div id="fb-breadcrumb" class="breadcrumb"></div></div>
          <div id="fb-body" class="box-body"></div>
        </div>
        <div id="file-viewer" class="file-viewer"></div>
        <div id="readme-render"></div>
      </section>

      <section id="tab-diff" class="hidden">
        <div class="box"><div class="box-header">Uncommitted changes</div><div id="diff-body" class="box-body"></div></div>
      </section>
    </div>
  </main>
</div>
<div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal()"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast-wrap" class="toast-wrap"></div>
<script src="/app.js"></script>
</body>
</html>
